name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: Check patch whitespace
        run: git diff --check

      - name: Run tests
        run: swift test --quiet

      - name: Verify visual baselines
        run: scripts/verify-visual-baselines.sh

      - name: Build release product
        run: swift build -c release --product DeskPetMac
